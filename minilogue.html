<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Minilogue Web Replica</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#0b0b0d;color:#ddd;font:600 10px -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
#app{display:flex;height:100%}
.wood{width:2.2%;min-width:14px;background:linear-gradient(90deg,#4a2a12,#8f5e32 45%,#4a2a12)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(#2c2c32,#17171a)}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#0f0f12;border-bottom:3px solid #ff6a1a}
header b{font-size:19px;letter-spacing:1px;color:#fff;font-style:italic;margin-right:auto}
header span{color:#888;font-weight:400}
select,button{font:600 11px -apple-system,system-ui,sans-serif;color:#fff;background:#34343c;border:1px solid #666;border-radius:5px;padding:6px 10px}
button.act{background:#ff6a1a;border-color:#ff6a1a;color:#000}
#panel{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.sec{border:1px solid #3c3c45;border-radius:6px;padding:4px 6px 6px;background:#1e1e23}
.sec h4{margin:0 0 4px;font-size:10px;color:#ff8a3a}
.row{display:flex;gap:6px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;align-items:center;width:46px;gap:3px;color:#aaa;font-size:8px;text-align:center}
.knob{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5a5a62,#111);border:2px solid #000;position:relative;touch-action:none;box-shadow:0 2px 4px #000}
.knob i{position:absolute;left:50%;top:3px;width:3px;height:14px;margin-left:-1.5px;background:#fff;border-radius:2px;transform-origin:1.5px 15px}
.sw{width:44px;height:28px;padding:0;font-size:9px;background:#2d2d34}
#bar{display:flex;gap:6px;align-items:center;padding:0 8px}
#seq{display:flex;gap:4px;flex:1}
.st{flex:1;height:36px;background:#2a2a30;border-radius:4px;font-size:9px;text-align:center;padding-top:3px;color:#999;touch-action:manipulation}
.st u{display:block;width:8px;height:8px;margin:0 auto 2px;border-radius:50%;background:#401010}
.st.on u{background:#ff3b30;box-shadow:0 0 6px #ff3b30}
.st.sel{outline:2px solid #ff8a3a}.st.ph{background:#4d4d58}
#kb{position:relative;display:flex;flex:1;min-height:110px;margin:8px;touch-action:none}
.k.w{flex:1;background:linear-gradient(#f5f5f1,#cdcdc6);border:1px solid #333;border-radius:0 0 4px 4px}
.k.b{position:absolute;top:0;width:4.4%;height:60%;background:linear-gradient(#3a3a3a,#000);border-radius:0 0 3px 3px;z-index:2}
.k.w.on{background:#ffb27a}.k.b.on{background:#ff6a1a}
#go{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;z-index:9}
</style></head><body>
<div id="go">Tap to start</div>
<div id="app"><div class="wood"></div><div id="main">
<header><b>minilogue <span>web replica</span></b><select id="pre"></select><button id="octDn">Oct −</button><button id="octUp">Oct +</button></header>
<div id="panel"></div>
<div id="bar"><button id="play">Play seq</button><button id="edit">Edit steps</button><div id="seq"></div></div>
<div id="kb"></div>
</div><div class="wood"></div></div>
<script>
const $=(s)=>document.querySelector(s);
const D={w1:0,o1:1,l1:.7,w2:0,o2:1,d2:.55,l2:.6,nz:0,cut:.6,res:.15,feg:.3,drv:.1,aa:.1,ad:.4,as:.7,ar:.4,fa:.1,fd:.4,fs:.3,fr:.4,lr:.3,li:0,lw:0,lt:0,dt:.4,df:.3,dm:0,vol:.7,tempo:.5,mode:0};
const p={...D};
const SW={w1:['SAW','TRI','SQR'],w2:['SAW','TRI','SQR'],o1:["16'","8'","4'","2'"],o2:["16'","8'","4'","2'"],lw:['SIN','TRI','SQR'],lt:['PITCH','CUTOFF','AMP'],mode:['POLY','MONO','UNI']};
const WV=['sawtooth','triangle','square'],OCT=[-1,0,1,2];
const PR=[
['Init saw',{}],
['Fat bass',{o1:0,o2:0,cut:.35,res:.3,feg:.5,aa:0,ad:.25,as:.5,ar:.15,fd:.25,fs:0,mode:1,drv:.3}],
['Warm pad',{w1:1,w2:0,d2:.6,cut:.45,feg:.2,aa:.7,ad:.7,as:.8,ar:.8,fa:.6,fs:.6,lr:.25,li:.15,lt:0,dm:.3,df:.4}],
['Pluck lead',{w1:2,o1:2,w2:0,o2:2,cut:.3,res:.3,feg:.6,aa:0,ad:.3,as:0,ar:.3,fd:.3,fs:0,dm:.25}],
['Super saw',{mode:2,d2:.6,cut:.7,aa:.05,ad:.5,as:.8,ar:.5,dm:.2}],
['Wobble',{o1:0,o2:0,cut:.3,res:.5,lt:1,lr:.55,li:.6,mode:1,drv:.4}],
['Space echo',{w1:1,w2:1,o1:2,o2:2,d2:.5,cut:.55,aa:.02,ad:.4,as:.3,ar:.7,dm:.55,df:.65,dt:.55}],
['Noise sweep',{l1:.1,l2:0,nz:.8,cut:.3,res:.6,feg:.9,fa:.8,fd:.8,fs:0,aa:.6,ad:.7,as:.7,ar:.8,dm:.3}]
];
const SECS=[
['VCO 1',[['s','w1','WAVE'],['s','o1','OCTAVE'],['k','l1','LEVEL']]],
['VCO 2',[['s','w2','WAVE'],['s','o2','OCTAVE'],['k','d2','DETUNE'],['k','l2','LEVEL']]],
['NOISE',[['k','nz','LEVEL']]],
['FILTER',[['k','cut','CUTOFF'],['k','res','RESO'],['k','feg','EG INT'],['k','drv','DRIVE']]],
['AMP EG',[['k','aa','ATTACK'],['k','ad','DECAY'],['k','as','SUSTAIN'],['k','ar','RELEASE']]],
['FILTER EG',[['k','fa','ATTACK'],['k','fd','DECAY'],['k','fs','SUSTAIN'],['k','fr','RELEASE']]],
['LFO',[['s','lw','WAVE'],['s','lt','TARGET'],['k','lr','RATE'],['k','li','INT']]],
['DELAY',[['k','dt','TIME'],['k','df','FEEDBACK'],['k','dm','MIX']]],
['MASTER',[['s','mode','VOICE'],['k','tempo','TEMPO'],['k','vol','VOLUME']]]
];
const ui={};
for(const [t,cs] of SECS){
 const s=document.createElement('div');s.className='sec';s.innerHTML=`<h4>${t}</h4><div class="row"></div>`;
 for(const [ty,id,lb] of cs){
  const c=document.createElement('div');c.className='ctl';
  if(ty=='k'){
   c.innerHTML=`<div class="knob"><i></i></div>${lb}`;const k=c.firstChild;
   ui[id]=()=>k.firstChild.style.transform=`rotate(${-135+p[id]*270}deg)`;
   k.onpointerdown=e=>{k.setPointerCapture(e.pointerId);const y=e.clientY,v=p[id];
    k.onpointermove=e=>{p[id]=Math.max(0,Math.min(1,v+(y-e.clientY)/150));ui[id]();apply(id)};
    k.onpointerup=k.onpointercancel=()=>k.onpointermove=null};
  }else{
   c.innerHTML=`<button class="sw"></button>${lb}`;const b=c.firstChild;
   ui[id]=()=>b.textContent=SW[id][p[id]];
   b.onclick=()=>{p[id]=(p[id]+1)%SW[id].length;ui[id]();apply()};
  }
  s.lastChild.append(c);
 }
 $('#panel').append(s);
}
const allUI=()=>Object.keys(ui).forEach(k=>ui[k]());
$('#pre').innerHTML=PR.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join('');
$('#pre').onchange=e=>{Object.assign(p,D,PR[e.target.value][1]);allUI();apply()};
allUI();

/* ---------- audio ---------- */
let A,bus,trem,sh,dly,fb,wet,mst,lfo,nbuf;const lg={};
function init(){
 if(A){A.resume();return}
 A=new(window.AudioContext||window.webkitAudioContext)();
 bus=A.createGain();trem=A.createGain();sh=A.createWaveShaper();mst=A.createGain();
 const cmp=A.createDynamicsCompressor();
 dly=A.createDelay(1);fb=A.createGain();wet=A.createGain();
 bus.connect(trem);trem.connect(sh);sh.connect(mst);
 sh.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(mst);
 mst.connect(cmp);cmp.connect(A.destination);
 lfo=A.createOscillator();lfo.start();
 for(const k of['p','c','a']){lg[k]=A.createGain();lfo.connect(lg[k])}
 lg.a.connect(trem.gain);
 const n=A.sampleRate*2;nbuf=A.createBuffer(1,n,A.sampleRate);
 const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 apply();A.resume();
}
function apply(id){
 if(!A)return;
 mst.gain.value=p.vol*.8;
 dly.delayTime.value=.03+p.dt*.7;fb.gain.value=p.df*.85;wet.gain.value=p.dm;
 lfo.type=['sine','triangle','square'][p.lw];lfo.frequency.value=.1*Math.pow(300,p.lr);
 const dep=[p.li*p.li*600,p.li*3600,p.li*.5];
 ['p','c','a'].forEach((k,i)=>lg[k].gain.value=p.lt==i?dep[i]:0);
 if(!id||id=='drv'){const k=1+p.drv*25,c=new Float32Array(257);
  for(let i=0;i<257;i++){c[i]=Math.tanh((i/128-1)*k)/Math.tanh(k)}sh.curve=c}
}
const T=v=>.002*Math.pow(2500,v);
let vs=[];
function start(n,t=A.currentTime){
 const f=440*2**((n-69)/12);
 vs=vs.filter(v=>!v.dead);
 if(p.mode==1)while(vs.length)stop(vs.shift(),t,.03);
 while(vs.length>=4)stop(vs.shift(),t,.03);
 const v={src:[],det:[],fl:[]};
 const amp=A.createGain(),f1=A.createBiquadFilter(),f2=A.createBiquadFilter(),mix=A.createGain();
 f1.type=f2.type='lowpass';
 const q=p.res*p.res*22;f1.Q.value=q*.4;f2.Q.value=q;
 const base=20*Math.pow(900,p.cut),pk=Math.min(19000,base*2**(p.feg*7));
 const fa=T(p.fa),fd=T(p.fd),aa=T(p.aa),ad=T(p.ad);
 for(const f of[f1,f2]){const F=f.frequency;
  F.setValueAtTime(base,t);F.exponentialRampToValueAtTime(pk,t+fa);
  F.setTargetAtTime(base+(pk-base)*p.fs,t+fa,fd/3);
  lg.c.connect(f.detune);v.fl.push(f)}
 amp.gain.setValueAtTime(0,t);amp.gain.linearRampToValueAtTime(1,t+aa);
 amp.gain.setTargetAtTime(p.as,t+aa,ad/3);
 mix.gain.value=.3;
 const ds=p.mode==2?[-14,0,14]:[0];
 [[p.w1,p.o1,0,p.l1],[p.w2,p.o2,(p.d2-.5)*100,p.l2]].forEach(([w,o,d,l])=>{
  if(l<.01)return;
  for(const s of ds){const os=A.createOscillator(),g=A.createGain();
   os.type=WV[w];os.frequency.value=f;os.detune.value=OCT[o]*1200+d+s;
   g.gain.value=l/ds.length;os.connect(g);g.connect(mix);lg.p.connect(os.detune);
   os.start(t);v.src.push(os);v.det.push(os.detune)}
 });
 if(p.nz>.01){const ns=A.createBufferSource(),g=A.createGain();
  ns.buffer=nbuf;ns.loop=true;g.gain.value=p.nz*.5;ns.connect(g);g.connect(mix);ns.start(t);v.src.push(ns)}
 mix.connect(f1);f1.connect(f2);f2.connect(amp);amp.connect(bus);
 v.amp=amp;v.base=base;vs.push(v);return v;
}
function stop(v,t=A.currentTime,rel){
 if(!v||v.dead)return;v.dead=true;
 const r=rel??T(p.ar),fr=rel??T(p.fr),g=v.amp.gain;
 g.cancelAndHoldAtTime?g.cancelAndHoldAtTime(t):g.cancelScheduledValues(t);
 g.setTargetAtTime(0,t,r/3);
 for(const f of v.fl){f.frequency.cancelAndHoldAtTime?f.frequency.cancelAndHoldAtTime(t):0;f.frequency.setTargetAtTime(v.base,t,fr/3)}
 v.src.forEach(s=>{try{s.stop(t+r*2+.1)}catch(e){}});
 setTimeout(()=>{try{v.det.forEach(d=>lg.p.disconnect(d));v.fl.forEach(f=>lg.c.disconnect(f.detune));v.amp.disconnect()}catch(e){}},(t-A.currentTime+r*2+.4)*1000);
}

/* ---------- keyboard ---------- */
let base=48,edit=0,sel=null;const kb=$('#kb'),act={},held={};
function drawKb(){let w=0,h='';
 for(let i=0;i<=24;i++){const n=base+i;
  if([1,3,6,8,10].includes(i%12))h+=`<div class="k b" data-n="${n}" style="left:${w*100/15-2.2}%"></div>`;
  else{h+=`<div class="k w" data-n="${n}"></div>`;w++}}
 kb.innerHTML=h}
const hl=(n,on)=>{const e=kb.querySelector(`[data-n="${n}"]`);if(e)e.classList.toggle('on',!!on)};
function kon(id,n){
 init();
 if(edit&&sel!=null){seq[sel].n=n;seq[sel].on=true;sel=(sel+1)%16;drawSeq()}
 held[id]=start(n);hl(n,1)}
function koff(id,n){stop(held[id]);delete held[id];hl(n,0)}
kb.onpointerdown=e=>{const k=e.target.closest('.k');if(!k)return;kb.setPointerCapture(e.pointerId);
 const n=+k.dataset.n;act[e.pointerId]=n;kon(e.pointerId,n)};
kb.onpointermove=e=>{if(!(e.pointerId in act))return;
 const el=document.elementFromPoint(e.clientX,e.clientY),k=el&&el.closest('.k');if(!k)return;
 const n=+k.dataset.n;if(n!=act[e.pointerId]){koff(e.pointerId,act[e.pointerId]);act[e.pointerId]=n;kon(e.pointerId,n)}};
kb.onpointerup=kb.onpointercancel=e=>{if(e.pointerId in act){koff(e.pointerId,act[e.pointerId]);delete act[e.pointerId]}};
$("#octDn").onclick=()=>{base=Math.max(24,base-12);drawKb()};
$("#octUp").onclick=()=>{base=Math.min(72,base+12);drawKb()};
drawKb();

/* ---------- sequencer ---------- */
const seq=[57,60,64,60,57,60,64,67,57,60,64,60,55,59,62,59].map((n,i)=>({n,on:i%2==0||i%4==3}));
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let playing=0,step=0,nextT=0,timer;
function drawSeq(){$('#seq').innerHTML=seq.map((s,i)=>`<div class="st${s.on?' on':''}${i==sel?' sel':''}" data-i="${i}"><u></u>${NN[s.n%12]}${Math.floor(s.n/12)-1}</div>`).join('')}
$('#seq').onpointerdown=e=>{const d=e.target.closest('.st');if(!d)return;const i=+d.dataset.i;
 if(edit)sel=i;else seq[i].on=!seq[i].on;drawSeq()};
$('#edit').onclick=function(){edit=!edit;sel=edit?0:null;this.classList.toggle('act',edit);drawSeq()};
function tick(){
 const sd=60/(70+p.tempo*110)/4;
 while(nextT<A.currentTime+.12){
  const s=seq[step],i=step,t=nextT;
  if(s.on){const v=start(s.n,t);stop(v,t+sd*.7)}
  setTimeout(()=>document.querySelectorAll('.st').forEach(x=>x.classList.toggle('ph',+x.dataset.i==i)),Math.max(0,(t-A.currentTime)*1000));
  nextT+=sd;step=(step+1)%16}
}
$('#play').onclick=function(){
 init();playing=!playing;this.classList.toggle('act',playing);
 if(playing){step=0;nextT=A.currentTime+.05;timer=setInterval(tick,25)}
 else{clearInterval(timer);setTimeout(()=>document.querySelectorAll('.ph').forEach(x=>x.classList.remove('ph')),200)}};
drawSeq();
$('#go').onpointerdown=e=>{init();e.currentTarget.remove()};
</script></body></html>
